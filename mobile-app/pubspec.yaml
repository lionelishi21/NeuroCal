name: neurocal
description: "NeuroCal: eat for how you want to think"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  amplify_auth_cognito: ^2.15.1
  amplify_flutter: ^2.15.0
  camera: ^0.12.0+2
  # Check-in reminders: notifications scheduled on the phone, no server needed.
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  # On-device text recognition, so live scan only keeps frames where the label is readable.
  google_mlkit_text_recognition: ^0.16.0
  # On-device barcode reading for food packages.
  google_mlkit_barcode_scanning: ^0.15.0
  # Sleep from Health Connect (Android) and Apple Health (iOS), read only.
  health: ^13.3.2
  # The Android home-screen widget's data (android/.../FocusWidget.kt).
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.3
  # The store's own rating dialog, at good moments only (lib/review/review_prompt.dart).
  in_app_review: ^2.0.12
  # The app's own folder for progress photos, which stay on the phone (lib/progress_photos.dart).
  path_provider: ^2.1.5
  # Subscriptions through the App Store and Google Play (https://www.revenuecat.com).
  purchases_flutter: ^10.15.2
  # Crash and error reports, when SENTRY_DSN is set (lib/main.dart). The Dart SDK: no native code.
  sentry: ^9.30.1
  # The phone's share sheet, for the Focus Score card.
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/foods/
  fonts:
    # Plus Jakarta Sans, the same face as the web app (SIL OFL, assets/fonts/OFL.txt).
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800

# App icons from assets/icon (masters rendered by tool/icon_test.dart): dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0E1325"
  adaptive_icon_foreground: assets/icon/foreground.png
